apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service-deployment
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      nodeSelector:
        file-service-node: "true"
      containers:
      - name: file-service
        image: hoangvu42/file-service:v1
        ports:
        - containerPort: 8084
        env:
        - name: STORAGE_DIR
          valueFrom:
            configMapKeyRef:
              name: file-service-config
              key: STORAGE_DIR
        - name: MONGO_USER
          valueFrom:
            configMapKeyRef:
              name: file-service-config
              key: MONGO_USER
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: file-service-secret
              key: MONGO_PASS
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: file-service-config
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: file-service-config
              key: MONGO_PORT
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/uploads
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: file-service-pvc
