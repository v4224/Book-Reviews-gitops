apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: hoangvu42/api-gateway:develop-d7b9f0e
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: api-gateway-config
